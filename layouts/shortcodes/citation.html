{{ $val := .Get 0 }}
{{ $cits := .Page.Store.Get "citations" }}

{{ if isset $cits $val }}

<a class="citation_id" href="#{{ $val }}">(c{{ index $cits $val }})</a>

{{ else }}

{{ $id := 0 }}
{{ with $cits }}
{{ $id = len $cits }}
{{ end }}

{{ .Page.Store.SetInMap "citations" $val $id }}

<a class="citation_id" href="#{{ $val }}">(c{{ $id }})</a>

{{ end }}
